# Сервер перед сайтом NAA.md (Next.js на порту 3000).
#
# Зачем он нужен. Next.js отдаёт запрос сайту только после того, как принял всё тело.
# Сайт отвечает 413 на тело больше 12 МБ, но сами байты к этому моменту уже приняты.
# nginx обрывает такой запрос по заголовку Content-Length и по фактически принятым
# байтам — до того, как запрос дойдёт до Node. Медленную «капельную» отправку
# обрывает client_body_timeout.
#
# Установка (Ubuntu/Debian):
#   sudo cp deploy/nginx/naa.conf /etc/nginx/sites-available/naa.conf
#   sudo ln -s /etc/nginx/sites-available/naa.conf /etc/nginx/sites-enabled/naa.conf
#   заменить naa.md на рабочий домен и пути к сертификатам
#   sudo nginx -t && sudo systemctl reload nginx
#
# Если сайт стоит за Cloudflare, у Cloudflare свой предел тела (100 МБ на бесплатном
# тарифе) — он не заменяет этот файл: предел 12 МБ задаётся здесь.

# Самый большой законный запрос — галерея фото детали из админки: 12 МБ (web/src/lib/http.ts, bodyLimits.gallery).
client_max_body_size 12m;
# Тело, которое тянется дольше 15 секунд между пакетами, обрывается.
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

server {
    listen 80;
    server_name naa.md www.naa.md;
    return 301 https://naa.md$request_uri;
}

server {
    listen 443 ssl http2;
    server_name naa.md www.naa.md;

    ssl_certificate     /etc/letsencrypt/live/naa.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naa.md/privkey.pem;

    # Публичные формы (заказ, заявка, отклик) — до 64 КБ, как в приложении (bodyLimits.form).
    location ~ ^/api/(orders|inquiries|vacancies|account|reviews|advertising)(/|$) {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/naa-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/naa-proxy.conf;
    }
}

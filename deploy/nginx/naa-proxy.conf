# Общие настройки проксирования для naa.conf.
#   sudo cp deploy/nginx/naa-proxy.conf /etc/nginx/snippets/naa-proxy.conf
proxy_http_version 1.1;
proxy_set_header Host $host;
# Сайт берёт адрес клиента из X-Forwarded-For (лимиты по адресу, web/src/lib/http.ts).
# Заголовок перезаписывается, а не дополняется: иначе клиент подставит чужой адрес и обойдёт лимит.
# За Cloudflare $remote_addr — адрес Cloudflare, и все посетители попали бы под один лимит.
# Тогда в http {} добавьте set_real_ip_from <диапазоны Cloudflare>; real_ip_header CF-Connecting-IP;
# — и $remote_addr станет настоящим адресом посетителя.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
# Тело не копится в памяти nginx целиком сверх нужного: отказ по размеру срабатывает раньше.
proxy_request_buffering on;
proxy_read_timeout 60s;
